# Shared analyzer configuration. The repository root is not a Dart package.
# Each app, library and tooling package resolves its own dependencies.
analyzer:
  exclude:
    - packages/dart_notcurses/**
    - build/**
    # Spikes are out-of-scope scratch: historical experiments, not owned
    # packages (repositoryExcludedRoots), never pub-resolved by CI's
    # owned-package step — analyzing them only produces resolution noise.
    - spikes/**
