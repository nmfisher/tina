name: tina
description: A minimal terminal coding agent.
publish_to: none
version: 0.1.1

environment:
  sdk: ^3.12.0

# Expose `bin/tina.dart` as a `tina` command on `dart pub global activate`
# (and locally). Without this, pub activates the package but installs no binary.
executables:
  tina:

dependencies:
  args: ^2.5.0
  html: ^0.15.0
  http: ^1.2.0
  image: ^4.5.0
  logging: ^1.3.0
  path: ^1.9.0
  toml: ^0.16.0
  fuzzy_ranker:
    path: packages/fuzzy_ranker
  tina_console:
    path: packages/tina_console
  tina_engine:
    path: packages/tina_engine
  tina_index:
    path: packages/tina_index

dev_dependencies:
  test: ^1.25.0
