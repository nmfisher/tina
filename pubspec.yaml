name: tina
description: A minimal terminal coding agent.
publish_to: none
version: 0.8.35

environment:
  sdk: ^3.12.0

# Expose `bin/tina.dart` as a `tina` command on `dart pub global activate`
# (and locally). Without this, pub activates the package but installs no binary.
executables:
  tina:

dependencies:
  tina_tui:
    path: packages/tina_tui

# Legacy sources and tests remain available during the cutover. None of these
# packages are imported by the executable; retire them after migration review.
dev_dependencies:
  tina_self_update:
    path: packages/plugins/tina_self_update
  args: ^2.5.0
  html: ^0.15.0
  http: ^1.2.0
  image: ^4.5.0
  logging: ^1.3.0
  markdown: ^7.3.1
  path: ^1.9.0
  toml: ^0.16.0
  attractor:
    path: packages/libraries/attractor
  fuzzy_ranker:
    path: packages/libraries/fuzzy_ranker
  tina_console:
    path: packages/tina_console
  classifier:
    path: packages/libraries/classifier
  tina_engine:
    path: packages/tina_engine
  tina_app:
    path: packages/tina_app
  tina_index:
    path: packages/plugins/tina_index


  analyzer: ^13.0.0
  yaml: ^3.1.3
  test: ^1.25.0
