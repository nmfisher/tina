name: tina
description: A minimal terminal coding agent.
publish_to: none
version: 0.9.37

environment:
  sdk: ^3.12.0

# Expose the engine2 executable on `dart pub global activate`.
executables:
  tina:

dependencies:
  tina_tui:
    path: packages/tina_tui

dev_dependencies:
  # Terminal diagnostics and root architecture/test tooling.
  tina_console:
    path: packages/tina_console
  analyzer: ^13.0.0
  path: ^1.9.0
  yaml: ^3.1.3
  test: ^1.25.0
