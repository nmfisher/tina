# Builds the tina CLI bundle for each staged target and publishes a GitHub
# Release with per-target tarballs.
#
# Targets build via tool/build_bundle.sh (Linux inside tool/docker/linux.Dockerfile,
# macOS native) — this workflow only wires up prerequisites, packaging, and
# release publishing. Native notcurses libs are pre-staged under
# packages/dart_notcurses/native/lib/<os>_<arch>/ and built into the bundle by
# the dart build hook.
#
# Triggers:
#   - push tag v*            → published release on that tag (make_latest)
#   - workflow_dispatch      → draft by default; publish=true publishes it
#     build_run_id can reuse successful builds from the exact pushed tag.
#
# Each target runs on a native runner (no QEMU): linux-arm64 on the free
# public arm64 Ubuntu runner.
#
# The wasm runner (tina-wasm-host) is a SEPARATE matrix: a single-file
# Rust binary with the engine + TUI wasm components embedded and their
# AOT-precompiled twins, built from this checkout's Dart sources via the
# paired wasm.dart repo (checked out at WASM_DART_REF below — the repos
# ship as a pair). macOS signing/notarization mirrors the CLI targets.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (defaults to 0.0.0-dev.<run_number>)'
        required: false
      build_run_id:
        description: 'Recover publishing using successful builds from this release run'
        required: false
      publish:
        description: 'Publish a dispatched release instead of creating a draft'
        type: boolean
        default: false

# TAG resolves the same way for every job: explicit dispatch input → the pushed
# tag → a dev fallback. Dispatches default to drafts unless publish is selected.
#
# MACOS_SIGNING_P12 mirrors the secret purely so step `if:` conditions can
# test whether signing is configured (the secrets context isn't allowed in
# step conditions). Empty → macOS signing/notarization steps skip cleanly.
# NOTARY_API_KEY gates notarization separately: signing works without it
# (binaries are signed, just not notarized) but notarization doesn't.
env:
  TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || format('0.0.0-dev.{0}', github.run_number) }}
  MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
  NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
  # Content of the minisign SECRET key (the pair whose public half is pinned
  # in install.sh and committed as minisign.pub). Empty → releases stay
  # checksum-only and install.sh says so.
  MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
  # The paired wasm.dart repo pinned by commit — the host crate source and
  # the wasm_tools/wasm_components the component builds resolve against.
  # Bump this ONLY together with a tina-side compat note; the repos ship
  # as a pair (see docs/option2-wasm-tui.md).
  WASM_DART_REF: 06aa0099eb9fd644eaba0a92e9d8fa3bc7394a87

# Least privilege: the default for every job is read-only; only the publish
# job escalates to contents:write (it creates the Release). The build jobs
# touch secrets (signing/notary) but never need to write repo contents.
permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.build_run_id }}
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-latest
            os_dir: macos_arm64
          - target: linux-x64
            runner: ubuntu-latest
            os_dir: linux_x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            os_dir: linux_arm64
    steps:
      - name: Checkout (with submodules for staged native libs + build hook)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      # v0.10.0 shipped binaries reporting 0.9.118: the tag was pushed without
      # bumping apps/tina_cli/pubspec.yaml, build_bundle.sh faithfully baked the
      # stale version in, and /update then offered the "new" release forever.
      # version_test.dart only guards pubspec ↔ version.g.dart consistency —
      # this guards tag ↔ pubspec. Real v* tags must match; dev/dispatch tags
      # (0.0.0-dev.<run>) skip.
      - name: Verify pubspec version matches the release tag
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "non-release tag '$TAG' — skipping version check"; exit 0 ;;
          esac
          want="${TAG#v}"
          got="$(sed -n 's/^version:[[:space:]]*//p' apps/tina_cli/pubspec.yaml | head -1)"
          if [ "$got" != "$want" ]; then
            echo "pubspec version '$got' != release tag '$TAG'." >&2
            echo "Bump apps/tina_cli/pubspec.yaml, run 'dart run apps/tina_cli/tool/generate_version.dart', commit, then re-tag." >&2
            exit 1
          fi

      # Only macOS builds natively on the host and needs a local Dart SDK
      # (>=3.12, per pubspec). Linux builds run inside the dart:3.12 Docker
      # image, so no host Dart is required there.
      - name: Set up Dart (macOS only)
        if: runner.os == 'macOS'
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: 3.12

      - name: Build bundle
        run: ./tool/build_bundle.sh ${{ matrix.target }}

      # ── macOS signing + notarization ─────────────────────────────────────
      # Gatekeeper blocks browser-downloaded (quarantined) unsigned binaries.
      # Fix: sign every Mach-O with the Developer ID Application cert
      # (hardened runtime — Dart AOT has no JIT, so it's safe) and notarize.
      # notarytool only accepts zip/dmg/pkg, so we submit a throwaway zip of
      # the same byte-identical bundle; Gatekeeper's ONLINE ticket check then
      # passes for the binaries inside the distributed tar.gz too (stapling
      # can't attach to tarballs — that's fine, the zip is just the ticket
      # vehicle). Every step no-ops when the signing secrets aren't configured
      # (forks, dev dispatches) so builds never break for their absence.
      - name: Import signing keychain (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING_P12 != ''
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass="$(uuidgen)"
          security create-keychain -p "$pass" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$MACOS_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          # Let codesign use the key without a GUI prompt (headless runner).
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$pass" "$keychain"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Codesign bundle binaries (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING_P12 != ''
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          bundle="build/cli/${{ matrix.os_dir }}/bundle"
          for bin in "$bundle/bin/tina" "$bundle/lib/"*.dylib; do
            # Entitlements: the Dart VM needs unsigned executable memory even
            # in AOT builds — hardened runtime without the exception is killed
            # at launch (see tool/macos-entitlements.plist).
            codesign --force --timestamp --options runtime \
              --entitlements tool/macos-entitlements.plist \
              --sign "$MACOS_SIGNING_IDENTITY" "$bin"
            codesign --verify --strict --verbose=2 "$bin"
          done
          echo "signed:"; codesign -dv "$bundle/bin/tina" 2>&1 | grep -E 'Authority|TeamIdentifier'

      # The signature must actually RUN, not just verify: a valid-on-disk
      # signature that the kernel kills at launch (the hardened-runtime /
      # unsigned-memory trap this build once shipped) passes codesign -v and
      # notarization alike. Cheap insurance before anything is packaged.
      - name: Smoke-test signed binary (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING_P12 != ''
        run: build/cli/${{ matrix.os_dir }}/bundle/bin/tina --version

      - name: Install runtime libraries for interactive smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo python3 tool/ci/use_ubuntu_mirror.py
          sudo apt-get update -q
          sudo apt-get install -y libtinfo6 libunistring5 libdeflate0 bubblewrap
          # Confined execution is required by the permission smoke checks.
          # Ubuntu's AppArmor user-namespace restriction otherwise prevents
          # bubblewrap from creating the test sandbox on hosted runners.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-user --unshare-pid --proc /proc -- /bin/true

      # Run the actual native UI before uploading any release artifacts.
      # --version cannot catch first-load modal or notcurses lifecycle failures.
      - name: Smoke-test release binary (isolated suites, three at a time)
        timeout-minutes: 15
        run: python3 tool/ci/run_release_smokes.py --jobs 3 --binary build/cli/${{ matrix.os_dir }}/bundle/bin/tina

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-logs-${{ env.TAG }}-${{ matrix.target }}
          path: build/smoke-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Notarize (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING_P12 != '' && env.NOTARY_API_KEY != ''
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          # pipefail: the runner's default shell (-e, no pipefail) would let
          # `notarytool | tee` report tee's exit status and mask a failed
          # notarization as success — this bit us once already.
          set -o pipefail
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_API_KEY" | base64 --decode > "$key"
          zip="tina-${{ env.TAG }}-${{ matrix.target }}-notarize.zip"
          # ditto preserves symlinks + signatures the way macOS expects.
          ditto -c -k --keepParent "build/cli/${{ matrix.os_dir }}/bundle" "$zip"
          auth=(--key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          if ! xcrun notarytool submit "$zip" "${auth[@]}" --wait \
              --output-format json | tee notary-result.json; then
            id=$(jq -r '.id // empty' notary-result.json 2>/dev/null) || true
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" "${auth[@]}" || true
            fi
            exit 1
          fi
          # Secrets-bearing files out of RUNNER_TEMP before the step ends.
          rm -f "$key" "$zip" notary-result.json

      - name: Drop signing keychain (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          if [ -e "$keychain" ]; then
            security delete-keychain "$keychain" || true
          fi

      - name: Verify bundle contents
        run: find build/cli/${{ matrix.os_dir }}/bundle -type f -exec ls -lh {} \;

      - name: Package tarball
        run: |
          tar -czf "tina-${{ env.TAG }}-${{ matrix.target }}.tar.gz" \
            -C "build/cli/${{ matrix.os_dir }}" bundle
          # SHA-256 sidecar asset — tina's /update verifies against it.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "tina-${{ env.TAG }}-${{ matrix.target }}.tar.gz" \
              > "tina-${{ env.TAG }}-${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "tina-${{ env.TAG }}-${{ matrix.target }}.tar.gz" \
              > "tina-${{ env.TAG }}-${{ matrix.target }}.tar.gz.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tina-${{ env.TAG }}-${{ matrix.target }}
          path: |
            tina-${{ env.TAG }}-${{ matrix.target }}.tar.gz
            tina-${{ env.TAG }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  build-wasm-runner:
    if: ${{ !inputs.build_run_id }}
    name: build wasm runner (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-latest
          - target: linux-x64
            runner: ubuntu-latest
    steps:
      - name: Checkout (with submodules for the component builds)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      # The paired wasm.dart repo, pinned by commit (env.WASM_DART_REF at
      # the top of this file): the host crate AND the wasm_tools /
      # wasm_components packages the engine/TUI component builds resolve
      # against via the build script's path overrides.
      - name: Checkout wasm.dart (paired pin)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: nmfisher/wasm.dart
          ref: ${{ env.WASM_DART_REF }}
          path: wasm.dart

      # Same tag ↔ pubspec guard as the CLI build job (the wasm runner embeds
      # this checkout's Dart sources, so a stale version mislabels it too).
      - name: Verify pubspec version matches the release tag
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "non-release tag '$TAG' — skipping version check"; exit 0 ;;
          esac
          want="${TAG#v}"
          got="$(sed -n 's/^version:[[:space:]]*//p' apps/tina_cli/pubspec.yaml | head -1)"
          if [ "$got" != "$want" ]; then
            echo "pubspec version '$got' != release tag '$TAG'." >&2
            echo "Bump apps/tina_cli/pubspec.yaml, run 'dart run apps/tina_cli/tool/generate_version.dart', commit, then re-tag." >&2
            exit 1
          fi

      # The component recipe pins the exact stable SDK (dart2wasm needs a
      # 3.14-era wasm_tools; the pin is also what local replicas use).
      - name: Set up Dart 3.14.0
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: 3.14.0

      # Stable Rust builds the host; nightly (with rust-src for build-std)
      # builds wasm_tools' untracked runtime_helpers.wasm asset on first
      # use. Stable is installed LAST so it is the default toolchain; the
      # helper script invokes `cargo +nightly` explicitly.
      - name: Set up Rust (nightly + wasm32 build-std)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
          components: rust-src
          targets: wasm32-unknown-unknown
      - name: Set up Rust (stable, default)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Build wasm runner (components rebuilt from release sources)
        # Bounds a hung build/smoke now that the smoke itself runs without
        # GNU timeout (missing on macOS; see tool/build_wasm_runner.sh).
        timeout-minutes: 60
        run: ./tool/build_wasm_runner.sh --wasm-dart "$GITHUB_WORKSPACE/wasm.dart"

      # ── macOS signing + notarization (mirrors the CLI targets) ─────────
      # Same conditions and mechanics as the build job above; the runner is
      # a single Mach-O. Wasmtime generates machine code at runtime (JIT),
      # so the hardened-runtime signature needs the same unsigned-executable-
      # memory entitlement the Dart VM does.
      - name: Import signing keychain (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING_P12 != ''
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass="$(uuidgen)"
          security create-keychain -p "$pass" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$MACOS_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain"             -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:             -k "$pass" "$keychain"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Codesign wasm runner (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING_P12 != ''
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          codesign --force --timestamp --options runtime \
            --entitlements tool/macos-entitlements.plist \
            --sign "$MACOS_SIGNING_IDENTITY" build/wasm-host/tina-wasm-host
          codesign --verify --strict --verbose=2 build/wasm-host/tina-wasm-host
          echo "signed:"; codesign -dv build/wasm-host/tina-wasm-host 2>&1 | grep -E 'Authority|TeamIdentifier'

      # The signed binary must actually RUN (the native job's lesson: a
      # valid-on-disk signature the kernel kills at launch passes
      # codesign -v). The boot smoke is the same one the build script ran,
      # now against the signed binary: ready frame + deserialize trace.
      - name: Smoke-test signed wasm runner (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING_P12 != ''
        timeout-minutes: 10
        run: RUNNER_OUT=build/wasm-host ./tool/build_wasm_runner.sh --smoke-only

      - name: Notarize wasm runner (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING_P12 != '' && env.NOTARY_API_KEY != ''
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -o pipefail
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_API_KEY" | base64 --decode > "$key"
          stage="$RUNNER_TEMP/wasm-host-stage/wasm-host"
          mkdir -p "$stage"
          cp build/wasm-host/tina-wasm-host "$stage/"
          zip="tina-wasm-host-${{ env.TAG }}-${{ matrix.target }}-notarize.zip"
          ( cd "$RUNNER_TEMP/wasm-host-stage" && ditto -c -k --keepParent wasm-host "$GITHUB_WORKSPACE/$zip" )
          auth=(--key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          if ! xcrun notarytool submit "$zip" "${auth[@]}" --wait \
              --output-format json | tee notary-result.json; then
            id=$(jq -r '.id // empty' notary-result.json 2>/dev/null) || true
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" "${auth[@]}" || true
            fi
            exit 1
          fi
          rm -f "$key" "$zip" notary-result.json

      - name: Drop signing keychain (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          if [ -e "$keychain" ]; then
            security delete-keychain "$keychain" || true
          fi

      - name: Package tarball
        run: |
          mkdir -p build/wasm-host/pkg/wasm-host
          mv build/wasm-host/tina-wasm-host build/wasm-host/pkg/wasm-host/
          tar -czf "tina-wasm-host-${{ env.TAG }}-${{ matrix.target }}.tar.gz" \
            -C build/wasm-host/pkg wasm-host
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "tina-wasm-host-${{ env.TAG }}-${{ matrix.target }}.tar.gz" \
              > "tina-wasm-host-${{ env.TAG }}-${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "tina-wasm-host-${{ env.TAG }}-${{ matrix.target }}.tar.gz" \
              > "tina-wasm-host-${{ env.TAG }}-${{ matrix.target }}.tar.gz.sha256"
          fi
          ls -lh tina-wasm-host-*.tar.gz*

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tina-wasm-host-${{ env.TAG }}-${{ matrix.target }}
          path: |
            tina-wasm-host-${{ env.TAG }}-${{ matrix.target }}.tar.gz
            tina-wasm-host-${{ env.TAG }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: [build, build-wasm-runner]
    # Recovery (build_run_id) reuses artifacts from a prior run — both
    # matrices' results are 'skipped' there, which the second arm covers.
    if: ${{ always() && ((needs.build.result == 'success' && needs.build-wasm-runner.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.build_run_id != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Last line of defense: also covers recovery dispatches (build_run_id),
      # which skip the build jobs and their guards entirely.
      - name: Verify pubspec version matches the release tag
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "non-release tag '$TAG' — skipping version check"; exit 0 ;;
          esac
          want="${TAG#v}"
          got="$(sed -n 's/^version:[[:space:]]*//p' apps/tina_cli/pubspec.yaml | head -1)"
          if [ "$got" != "$want" ]; then
            echo "pubspec version '$got' != release tag '$TAG'." >&2
            echo "Bump apps/tina_cli/pubspec.yaml, run 'dart run apps/tina_cli/tool/generate_version.dart', commit, then re-tag." >&2
            exit 1
          fi

      - name: Validate recovered builds against release tag
        if: inputs.build_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          python3 tool/ci/validate_release_recovery.py "$GITHUB_REPOSITORY" "$BUILD_RUN_ID" "$TAG"

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ inputs.build_run_id || github.run_id }}
          github-token: ${{ github.token }}
          # ONE covering glob: the wasm-runner uploads carry their own
          # tina-wasm-host-<tag>-<target> prefix, which tina-<tag>-* does
          # NOT match — dry-run 43675473799 attached only the native
          # tarballs for exactly this reason. The vendored
          # download-artifact pin treats `pattern` as a SINGLE glob: no
          # comma splitting (dry-run #4: 'a,b' one line -> 0 downloaded)
          # and no newline splitting (dry-run #3: block -> 0 downloaded).
          # `tina-*<tag>-*` covers both prefixes — the `*` absorbs the
          # optional `wasm-host-` before the tag; smoke-logs-* still
          # doesn't match. (Follow-up, not now: bump the action pin to a
          # v4.x with real multi-pattern support, then split this back
          # into two explicit patterns.)
          pattern: tina-*${{ env.TAG }}-*
          merge-multiple: false
          path: artifacts

      - name: Collect tarballs
        run: |
          mkdir -p assets
          find artifacts \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} assets/ \;
          echo "## Release artifacts" > body.md
          echo "" >> body.md
          ( cd assets && find . -name '*.tar.gz' | sed 's#^\./#- #' ) >> body.md
          echo "---"; find assets -name '*.tar.gz' -exec ls -lh {} \;

      # Aggregate checksum manifest — the file install.sh verifies (and what
      # the minisign signature below covers, authenticating every tarball).
      - name: Generate checksum manifest
        run: |
          ( cd assets && sha256sum -- *.tar.gz > sha256sums.txt )
          cat assets/sha256sums.txt

      # ── Minisign manifest signature ─────────────────────────────────────
      # Signs sha256sums.txt so install.sh can pin authenticity to the
      # committed minisign.pub. Skips cleanly when the secret isn't
      # configured (forks) — those releases stay checksum-only.
      - name: Sign manifest (minisign)
        if: env.MINISIGN_SECRET_KEY != ''
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          sudo python3 tool/ci/use_ubuntu_mirror.py
          sudo apt-get update -q && sudo apt-get install -y -q minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          chmod 600 "$RUNNER_TEMP/minisign.key"
          # The key is unencrypted; minisign still prompts for the (empty)
          # password, and CI has no tty — feed it one empty line.
          printf '\n' | minisign -S -q -s "$RUNNER_TEMP/minisign.key" \
            -m assets/sha256sums.txt -x assets/sha256sums.txt.minisig
          # Prove the signature verifies against the PUBLIC key pinned in
          # install.sh — the whole chain is worthless if the pair drifted.
          printf '%s\n%s\n' "untrusted comment: minisign public key 998FE64CB07F896A" \
            "RWRqiX+wTOaPmS7+JVz0pccep+0NBr6xDpLrf37v054BXCPDnGbpma92" \
            > "$RUNNER_TEMP/release.pub"
          minisign -V -q -p "$RUNNER_TEMP/release.pub" \
            -x assets/sha256sums.txt.minisig -m assets/sha256sums.txt
          rm -f "$RUNNER_TEMP/minisign.key"

      - name: Compute asset list
        id: assets
        run: |
          list="assets/*.tar.gz
          assets/*.sha256
          assets/sha256sums.txt"
          [ -f assets/sha256sums.txt.minisig ] && list="$list
          assets/sha256sums.txt.minisig"
          {
            echo 'files<<EOF'
            echo "$list"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create / attach release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: body.md
          draft: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
          make_latest: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          files: ${{ steps.assets.outputs.files }}
          fail_on_unmatched_files: true

      # Install-path regression guard: v0.6.1's installer copied only the
      # binary, and nothing caught it — `tina --version` (the only smoke test
      # anywhere) exits before native-asset loading, so the notcurses lib was
      # never exercised at the installed layout. This runs the actual
      # installer (pinned to the tag that just shipped) and asserts the
      # private bundle layout and its launcher symlink. Native libraries stay
      # beside the real binary in the private bundle, outside the PATH directory.
      - name: Verify installer against the published release
        if: github.event_name == 'push' || inputs.publish
        run: |
          sudo python3 tool/ci/use_ubuntu_mirror.py
          sudo apt-get update -q && sudo apt-get install -y -q minisign
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ env.TAG }}/install.sh" \
            -o install-check.sh
          dir="$RUNNER_TEMP/tina-installed"
          bundle="$RUNNER_TEMP/tina-bundle"
          sh install-check.sh --dir "$dir" --bundle-dir "$bundle" --version "${{ env.TAG }}"
          test -L "$dir/tina"
          test -x "$dir/tina"
          test "$(readlink "$dir/tina")" = "$bundle/bin/tina"
          test -f "$bundle/.tina-bundle"
          lib="$(find "$bundle/lib" -name 'libnotcurses_merged.*' | head -1)"
          test -n "$lib" || {
            echo "installed bundle is missing libnotcurses_merged at $bundle/lib" >&2
            exit 1
          }
          # The installed binary must report the tag's version, not just run:
          # v0.10.0 shipped a binary saying 0.9.118 and this check passed.
          version_out="$("$dir/tina" --version)"
          echo "$version_out"
          case "$version_out" in
            *" ${TAG#v} "*) ;;
            *)
              echo "installed binary reports '$version_out', expected version ${TAG#v}" >&2
              exit 1
              ;;
          esac
