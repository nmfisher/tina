# Builds the tina CLI bundle for each staged target and publishes a GitHub
# Release with per-target tarballs.
#
# Targets build via tool/build_bundle.sh (Linux inside tool/docker/linux.Dockerfile,
# macOS native) — this workflow only wires up prerequisites, packaging, and
# release publishing. Native notcurses libs are pre-staged under
# packages/dart_notcurses/native/lib/<os>_<arch>/ and built into the bundle by
# the dart build hook.
#
# Triggers:
#   - push tag v*            → published release on that tag (make_latest)
#   - workflow_dispatch      → draft release (tag = input or 0.0.0-dev.<run>)
#
# Each target runs on a native runner (no QEMU): linux-arm64 on the free
# public arm64 Ubuntu runner.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (defaults to 0.0.0-dev.<run_number>)'
        required: false

# TAG resolves the same way for every job: explicit dispatch input → the pushed
# tag → a dev fallback. tag-push => published; dispatch => draft.
#
# MACOS_SIGNING_P12 mirrors the secret purely so step `if:` conditions can
# test whether signing is configured (the secrets context isn't allowed in
# step conditions). Empty → macOS signing/notarization steps skip cleanly.
# NOTARY_API_KEY gates notarization separately: signing works without it
# (binaries are signed, just not notarized) but notarization doesn't.
env:
  TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || format('0.0.0-dev.{0}', github.run_number) }}
  MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
  NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}

# Least privilege: the default for every job is read-only; only the publish
# job escalates to contents:write (it creates the Release). The build jobs
# touch secrets (signing/notary) but never need to write repo contents.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-latest
            os_dir: macos_arm64
          - target: linux-x64
            runner: ubuntu-latest
            os_dir: linux_x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            os_dir: linux_arm64
    steps:
      - name: Checkout (with submodules for staged native libs + build hook)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      # Only macOS builds natively on the host and needs a local Dart SDK
      # (>=3.12, per pubspec). Linux builds run inside the dart:3.12 Docker
      # image, so no host Dart is required there.
      - name: Set up Dart (macOS only)
        if: runner.os == 'macOS'
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: 3.12

      - name: Build bundle
        run: ./tool/build_bundle.sh ${{ matrix.target }}

      # ── macOS signing + notarization ─────────────────────────────────────
      # Gatekeeper blocks browser-downloaded (quarantined) unsigned binaries.
      # Fix: sign every Mach-O with the Developer ID Application cert
      # (hardened runtime — Dart AOT has no JIT, so it's safe) and notarize.
      # notarytool only accepts zip/dmg/pkg, so we submit a throwaway zip of
      # the same byte-identical bundle; Gatekeeper's ONLINE ticket check then
      # passes for the binaries inside the distributed tar.gz too (stapling
      # can't attach to tarballs — that's fine, the zip is just the ticket
      # vehicle). Every step no-ops when the signing secrets aren't configured
      # (forks, dev dispatches) so builds never break for their absence.
      - name: Import signing keychain (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING_P12 != ''
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass="$(uuidgen)"
          security create-keychain -p "$pass" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$MACOS_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          # Let codesign use the key without a GUI prompt (headless runner).
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$pass" "$keychain"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Codesign bundle binaries (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING_P12 != ''
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          bundle="build/cli/${{ matrix.os_dir }}/bundle"
          for bin in "$bundle/bin/tina" "$bundle/lib/"*.dylib; do
            codesign --force --timestamp --options runtime \
              --sign "$MACOS_SIGNING_IDENTITY" "$bin"
            codesign --verify --strict --verbose=2 "$bin"
          done
          echo "signed:"; codesign -dv "$bundle/bin/tina" 2>&1 | grep -E 'Authority|TeamIdentifier'

      - name: Notarize (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING_P12 != '' && env.NOTARY_API_KEY != ''
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          # pipefail: the runner's default shell (-e, no pipefail) would let
          # `notarytool | tee` report tee's exit status and mask a failed
          # notarization as success — this bit us once already.
          set -o pipefail
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_API_KEY" | base64 --decode > "$key"
          zip="tina-${{ env.TAG }}-${{ matrix.target }}-notarize.zip"
          # ditto preserves symlinks + signatures the way macOS expects.
          ditto -c -k --keepParent "build/cli/${{ matrix.os_dir }}/bundle" "$zip"
          auth=(--key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          if ! xcrun notarytool submit "$zip" "${auth[@]}" --wait \
              --output-format json | tee notary-result.json; then
            id=$(jq -r '.id // empty' notary-result.json 2>/dev/null) || true
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" "${auth[@]}" || true
            fi
            exit 1
          fi
          # Secrets-bearing files out of RUNNER_TEMP before the step ends.
          rm -f "$key" "$zip" notary-result.json

      - name: Drop signing keychain (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          if [ -e "$keychain" ]; then
            security delete-keychain "$keychain" || true
          fi

      - name: Verify bundle contents
        run: find build/cli/${{ matrix.os_dir }}/bundle -type f -exec ls -lh {} \;

      - name: Package tarball
        run: |
          tar -czf "tina-${{ env.TAG }}-${{ matrix.target }}.tar.gz" \
            -C "build/cli/${{ matrix.os_dir }}" bundle
          # SHA-256 sidecar asset — tina's /update verifies against it.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "tina-${{ env.TAG }}-${{ matrix.target }}.tar.gz" \
              > "tina-${{ env.TAG }}-${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "tina-${{ env.TAG }}-${{ matrix.target }}.tar.gz" \
              > "tina-${{ env.TAG }}-${{ matrix.target }}.tar.gz.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tina-${{ env.TAG }}-${{ matrix.target }}
          path: |
            tina-${{ env.TAG }}-${{ matrix.target }}.tar.gz
            tina-${{ env.TAG }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tina-${{ env.TAG }}-*
          merge-multiple: false
          path: artifacts

      - name: Collect tarballs
        run: |
          mkdir -p assets
          find artifacts \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} assets/ \;
          echo "## Release artifacts" > body.md
          echo "" >> body.md
          ( cd assets && find . -name '*.tar.gz' | sed 's#^\./#- #' ) >> body.md
          echo "---"; find assets -name '*.tar.gz' -exec ls -lh {} \;

      - name: Create / attach release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: body.md
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          make_latest: ${{ github.event_name != 'workflow_dispatch' }}
          files: |
            assets/*.tar.gz
            assets/*.sha256
          fail_on_unmatched_files: true
