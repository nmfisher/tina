# CI for the engine2 executable and every owned package.
# Retired app/engine packages are not part of the build or test matrix.
#
# Owned-package inventory (A08): tool/architecture/policy.json lists the owned
# packages plus the vendored dart_notcurses submodule exception. The root job's
# architecture test (test/architecture/import_boundary_test.dart →
# policy.validateWorkspace) FAILS on any packages/*/pubspec.yaml outside that
# list — a new package must join the policy AND gain a job here or an
# explicitly reviewed exclusion; it cannot silently inherit root-only coverage.
# The root job pub-gets every owned package before analyze: the architecture
# graph reads each package's .dart_tool/package_config.json. That step's list
# is generated from the same policy file, so a package in the policy cannot be
# left unprefetched — classifier tripped exactly this on its first PR run,
# back when the list was hand-written; the generated loop below is the fix.
#
# No dart format gate on purpose: the tree has format drift, and analyze +
# test are the contract this repo actually tracks.
#
# Native library note: tina_console's FFI does NOT load a system libnotcurses
# via findLibrary/DynamicLibrary.open for its bindings. dart_notcurses vendors
# libnotcurses-core.a under native/lib/<os>_<arch>/ inside the submodule, and
# its build hook (hook/build.dart) statically links it into a bundled shared
# asset (libnotcurses_merged) that @Native(assetId:) resolves automatically —
# no DynamicLibrary.open of notcurses anywhere in the binding layer. The two
# DynamicLibrary.open sites in tina_console itself are best-effort probes:
#   - notcurses_probe.dart: isNotcursesAvailable() tries libnotcurses.so /
#     libnotcurses.so.3 purely to report availability (never throws);
#   - init_reply_guard.dart: _resolveOpenpty() probes libutil.so for openpty.
# Installing libnotcurses-dev therefore only makes the probe report true (and
# gives init a real system library when one is wanted); the vendored static
# link keeps the suite green either way. We install it so CI exercises the
# same live-library path a developer machine has.
#
# LINKER deps (learned on the first live run, 32647847129): the build hook
# statically links the vendored libnotcurses-core.a but leaves -ltinfo,
# -lunistring and -ldeflate as SYSTEM shared libraries (hook/build.dart's
# Linux flags) — and ubuntu-latest ships none of their -dev link symlinks.
# dart test then dies in the hook with `cannot find -lunistring/-ldeflate`.
# Both the console job AND the root job (root's tests import tina_console,
# so its dart test runs the same hook) must apt-install all of:
#   libnotcurses-dev (probe path) + libtinfo-dev libunistring-dev
#   libdeflate-dev (link deps).

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos_interactive:
    name: macOS interactive startup
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12'
      - name: Resolve dependencies
        run: dart pub get
      - name: Check native keyboard decoding
        timeout-minutes: 6
        run: python3 tool/altkey_pty_driver.py
      - name: Test active tools against the macOS sandbox
        working-directory: packages/plugins/tina_tools
        run: |
          dart pub get
          dart test --tags live-os-sandbox --run-skipped
      - name: Build native CLI
        run: dart build cli --target bin/tina.dart
      - name: Open first-load picker and quit at small and normal sizes
        run: |
          mkdir -p "$RUNNER_TEMP/tina-launcher"
          ln -s "$PWD/build/cli/macos_arm64/bundle/bin/tina" "$RUNNER_TEMP/tina-launcher/tina"
          python3 tool/smoke_engine2.py --binary "$RUNNER_TEMP/tina-launcher/tina"

  root:
    name: root (tina)
    runs-on: ubuntu-latest
    steps:
      # Submodules: recursive — packages/dart_notcurses is a git submodule and
      # the tree embeds its native sources + staged static libs; tina_console
      # FFI-links them through the dart_notcurses build hook.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: pub get (root)
        working-directory: .
        run: dart pub get

      # Root's analyze sweeps the sub-packages' test/ dirs, and those tests
      # import packages (e.g. tina_console's fake_async) that only resolve
      # through EACH package's own .dart_tool/package_config.json — learn from
      # the first live run: without these pub gets, root analyze saw 23
      # URI_DOES_NOT_EXIST errors for console's test-only imports. This
      # mirrors a dev machine, where every package has been pub-got.
      #
      # The package list below is GENERATED from tool/architecture/policy.json
      # (ownedPackages), not written by hand. A hand-written copy here went
      # stale the first time a package joined the policy without editing this
      # file, and CI failed with a bare PathNotFoundException that never named
      # the fix. Do not turn this back into a list of cd commands — one list,
      # the policy's, is the point. ownedPackages also names the root package
      # ("tina"), which is the repo root, not packages/tina; it is mapped to
      # "." and skipped because the step above already pub-got it. The vendored
      # dart_notcurses submodule is NOT in ownedPackages, so reading the policy
      # (not a packages/* glob) is also what keeps the submodule out.
      - name: pub get (owned packages, for analyze and architecture checks)
        run: |
          # jq's -r prints raw strings, one per owned package; the root
          # package "tina" maps to "." and is skipped below.
          directories=$(jq -r '.packagePaths[]' tool/architecture/policy.json)
          for d in $directories; do
            if [ "$d" = "." ]; then continue; fi  # root: pub get ran above
            echo "pub get in $d"
            (cd "$d" && dart pub get)
          done

      # Root's own tests import tina_console → the dart_notcurses build hook
      # runs on dart test → the system linker deps must be present (see the
      # header's LINKER deps note).
      - name: Install native link deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libnotcurses-dev libtinfo-dev libunistring-dev libdeflate-dev

      # Root gates on zero issues. (History: this gate was born count-based —
      # it tolerated exactly ONE known warning, the submodule's
      # include_file_not_found, and emitted a ::notice:: if it ever hit zero.
      # Log item #40 then added the root analysis_options.yaml whose
      # analyzer.exclude silences the submodule config in the parent context,
      # the root analyzer reached zero, and the gate tightened to plain
      # `dart analyze` exactly as that notice suggested.)
      - name: analyze (root)
        working-directory: .
        run: dart analyze

      - name: test (root)
        working-directory: .
        run: |
          if dart test -j 4 --file-reporter "json:$RUNNER_TEMP/tina-tests.json"; then
            exit 0
          else
            python3 tool/report_test_failures.py "$RUNNER_TEMP/tina-tests.json"
            exit 1
          fi

      - name: Check native keyboard decoding
        timeout-minutes: 6
        run: python3 tool/altkey_pty_driver.py

  console:
    name: console (packages/tina_console)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # The notcurses backend's availability probe loads libnotcurses.so(.3)
      # from the system loader (see header comment), and the build hook needs
      # the system link deps (-ltinfo -lunistring -ldeflate) — see the
      # header's LINKER deps note; the first live run failed on the latter.
      - name: Install native notcurses + link deps (console job)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnotcurses-dev libtinfo-dev libunistring-dev libdeflate-dev

      - name: pub get (console)
        working-directory: packages/tina_console
        run: dart pub get

      # Console gates on zero issues (verified baseline: "No issues found!").
      - name: analyze (console)
        working-directory: packages/tina_console
        run: dart analyze

      - name: test (console)
        working-directory: packages/tina_console
        run: dart test -j 4

  index:
    name: index (packages/plugins/tina_index)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: pub get (index)
        working-directory: packages/plugins/tina_index
        run: dart pub get

      # Index gates on zero issues (verified baseline: "No issues found!").
      # Pure Dart — no native deps, no apt step needed.
      - name: analyze (index)
        working-directory: packages/plugins/tina_index
        run: dart analyze

      - name: test (index)
        working-directory: packages/plugins/tina_index
        run: dart test -j 4

  # attractor and fuzzy_ranker are terminal-free (attractor: logging + path;
  # fuzzy_ranker: no runtime deps — A08 verified both suites green in their
  # own dependency context: attractor 89 tests, fuzzy_ranker 11, analyze
  # clean). No submodule checkout and no notcurses/linker apt step here: the
  # absence of native terminal dependencies must stay observable, per the A08
  # spec — these jobs fail loudly if either package ever grows one.
  attractor:
    name: attractor (packages/libraries/attractor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: pub get (attractor)
        working-directory: packages/libraries/attractor
        run: dart pub get

      - name: analyze (attractor)
        working-directory: packages/libraries/attractor
        run: dart analyze

      - name: test (attractor)
        working-directory: packages/libraries/attractor
        run: dart test -j 4

  tina_settings:
    name: tina_settings (packages/libraries/tina_settings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
