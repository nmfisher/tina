        run: dart pub get
      - name: analyze (tina_sqlite)
        working-directory: packages/tina_sqlite
        run: dart analyze
      - name: test (tina_sqlite)
        working-directory: packages/tina_sqlite
        run: dart test -j 4

  # tina_tui imports tina_console deliberately (it is in terminalPackages),
  # so like the console job it needs the submodule checkout and the native
  # linker deps for the dart_notcurses build hook (see header LINKER deps).
  tina_subagents:
