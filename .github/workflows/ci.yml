  # tina_sqlite is terminal-free; its only external dep is sqlite3, whose
  # native-assets build hook compiles its bundled SQLite on `dart test` —
  # a C toolchain is already present on the ubuntu runner. The `live`
  # smoke test is skipped by default (dart_test.yaml), so the CI job
  # never touches the network.
  tina_sqlite:
    name: tina_sqlite (packages/tina_sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
