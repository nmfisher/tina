# Continuous integration for tina: `dart analyze` + `dart test` for the root
# package and the two testable sub-packages, on every PR to main and every
# push to main. (tina_index joins the matrix once log item #39 ships — its
# suite has a known pre-existing failure at the time this workflow was
# written; engine 767 + console 811 + root 758 tests gate here.)
#
# No dart format gate on purpose: the tree has format drift, and analyze +
# test are the contract this repo actually tracks (TINA_IMPROVEMENTS_LOG.md).
#
# Native library note: tina_console's FFI does NOT load a system libnotcurses
# via findLibrary/DynamicLibrary.open for its bindings. dart_notcurses vendors
# libnotcurses-core.a under native/lib/<os>_<arch>/ inside the submodule, and
# its build hook (hook/build.dart) statically links it into a bundled shared
# asset (libnotcurses_merged) that @Native(assetId:) resolves automatically —
# no DynamicLibrary.open of notcurses anywhere in the binding layer. The two
# DynamicLibrary.open sites in tina_console itself are best-effort probes:
#   - notcurses_probe.dart: isNotcursesAvailable() tries libnotcurses.so /
#     libnotcurses.so.3 purely to report availability (never throws);
#   - init_reply_guard.dart: _resolveOpenpty() probes libutil.so for openpty.
# Installing libnotcurses-dev therefore only makes the probe report true (and
# gives init a real system library when one is wanted); the vendored static
# link keeps the suite green either way. We install it so CI exercises the
# same live-library path a developer machine has.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  root:
    name: root (tina)
    runs-on: ubuntu-latest
    steps:
      # Submodules: recursive — packages/dart_notcurses is a git submodule and
      # the tree embeds its native sources + staged static libs; tina_console
      # FFI-links them through the dart_notcurses build hook.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: pub get (root)
        working-directory: .
        run: dart pub get

      # Root analyze baseline is NOT zero: analyzing the repo root also picks
      # up packages/dart_notcurses (the submodule), whose analysis_options.yaml
      # includes package:lints/recommended.yaml without declaring lints as a
      # dev dependency — producing exactly ONE known warning:
      #   include_file_not_found (packages/dart_notcurses/analysis_options.yaml:1:10)
      # Gate by count instead of exit code: fail on any NEW issue (>1), tolerate
      # exactly the known one (==1). When the submodule config is fixed or the
      # warning disappears, tighten this to plain `dart analyze` + zero.
      - name: analyze (root)
        working-directory: .
        run: |
          set +e
          dart analyze --format=machine | tee /tmp/root_analyze.txt
          issues=$(grep -c . /tmp/root_analyze.txt || true)
          echo "root analyzer issues: $issues"
          if [ "$issues" -gt 1 ]; then
            echo "::error::root analyze regressed: $issues issues (baseline is exactly 1 — the submodule's include_file_not_found config warning). Fix the new issue(s); do not raise the baseline."
            exit 1
          fi
          if [ "$issues" -eq 0 ]; then
            echo "::notice::root analyze hit ZERO issues — the known submodule warning is gone; consider tightening this gate to plain 'dart analyze'."
          fi
          exit 0

      - name: test (root)
        working-directory: .
        run: dart test

  engine:
    name: engine (packages/tina_engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: pub get (engine)
        working-directory: packages/tina_engine
        run: dart pub get

      # Engine gates on zero issues (verified baseline: "No issues found!").
      - name: analyze (engine)
        working-directory: packages/tina_engine
        run: dart analyze

      - name: test (engine)
        working-directory: packages/tina_engine
        run: dart test

  console:
    name: console (packages/tina_console)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # The notcurses backend's availability probe loads libnotcurses.so(.3)
      # from the system loader (see header comment). Install the dev package
      # so CI matches a developer machine; the vendored static link means the
      # suite passes even without it, but the probe path is then untested.
      - name: Install native notcurses (console job)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnotcurses-dev

      - name: pub get (console)
        working-directory: packages/tina_console
        run: dart pub get

      # Console gates on zero issues (verified baseline: "No issues found!").
      - name: analyze (console)
        working-directory: packages/tina_console
        run: dart analyze

      - name: test (console)
        working-directory: packages/tina_console
        run: dart test
