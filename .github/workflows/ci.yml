      - name: pub get (tina_settings)
        working-directory: packages/libraries/tina_settings
        run: dart pub get
      - name: analyze (tina_settings)
        working-directory: packages/libraries/tina_settings
        run: dart analyze
      - name: test (tina_settings)
        working-directory: packages/libraries/tina_settings
        run: dart test -j 4

  fuzzy_ranker:
    name: fuzzy_ranker (packages/libraries/fuzzy_ranker)
    runs-on: ubuntu-latest
