      - name: analyze (fuzzy_ranker)
        working-directory: packages/libraries/fuzzy_ranker
        run: dart analyze

      - name: test (fuzzy_ranker)
        working-directory: packages/libraries/fuzzy_ranker
        run: dart test -j 4

  # Classification: user intent/Git plugin, structured judgments and retained
  # repository exploration APIs. Terminal-free and native-free — plain checkout.
  # Its judgments half is additionally
  # pinned pure (no dart:io) by the root architecture test's pureFiles rule.
  classification:
    name: classification (packages/classification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: pub get (classification)
        working-directory: packages/classification
        run: dart pub get

      - name: analyze (classification)
        working-directory: packages/classification
        run: dart analyze

      - name: test (classification)
        working-directory: packages/classification
        run: dart test -j 4

  file_tree:
    name: file_tree (packages/libraries/file_tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: pub get (file_tree)
        working-directory: packages/libraries/file_tree
        run: dart pub get
      - name: analyze (file_tree)
        working-directory: packages/libraries/file_tree
        run: dart analyze
      - name: test (file_tree)
        working-directory: packages/libraries/file_tree
        run: dart test -j 4

  # engine2 provider split (policy update): tina_core, tina_llm, tina_tools,
  # tina_engine_2 and tina_host are terminal-free (path deps within the
  # workspace, no submodule, no native linker deps) — plain checkout like
  # attractor/fuzzy_ranker/file_tree. tina_core has a test/ directory now
  # (session-log entry types + derive), so its job gates on pub get +
  # analyze + test like every other owned package.
  tina_core:
    name: tina_core (packages/tina_core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: pub get (tina_core)
        working-directory: packages/tina_core
        run: dart pub get
      - name: analyze (tina_core)
        working-directory: packages/tina_core
        run: dart analyze
      - name: test (tina_core)
        working-directory: packages/tina_core
        run: dart test -j 4

  tina_llm:
    name: tina_llm (packages/tina_llm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: pub get (tina_llm)
        working-directory: packages/tina_llm
        run: dart pub get
      - name: analyze (tina_llm)
        working-directory: packages/tina_llm
        run: dart analyze
      - name: test (tina_llm)
        working-directory: packages/tina_llm
        run: dart test -j 4

  tina_tools:
    name: tina_tools (packages/plugins/tina_tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: pub get (tina_tools)
        working-directory: packages/plugins/tina_tools
        run: dart pub get
      - name: analyze (tina_tools)
        working-directory: packages/plugins/tina_tools
        run: dart analyze
      - name: test (tina_tools)
        working-directory: packages/plugins/tina_tools
        run: dart test -j 4

      - name: Install Linux sandbox backend
        run: sudo apt-get update -q && sudo apt-get install -y bubblewrap

      - name: Test active tools against the Linux sandbox
        working-directory: packages/plugins/tina_tools
        run: |
          # Hosted Ubuntu restricts user namespaces through AppArmor. Restore
          # the setting after this explicit integration check on the runner.
          command -v bwrap
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            tina_userns_original=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)
            trap 'sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns="$tina_userns_original"' EXIT
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          dart test --tags live-os-sandbox --run-skipped

  tina_engine_2:
    name: tina_engine_2 (packages/tina_engine_2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: pub get (tina_engine_2)
        working-directory: packages/tina_engine_2
        run: dart pub get
      - name: analyze (tina_engine_2)
        working-directory: packages/tina_engine_2
        run: dart analyze
      - name: test (tina_engine_2)
        working-directory: packages/tina_engine_2
        run: dart test -j 4

  tina_host:
    name: tina_host (packages/tina_host)
    runs-on: ubuntu-latest
    steps:
