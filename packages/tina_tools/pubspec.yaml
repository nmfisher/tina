name: tina_tools
description: The basic file tools (ls, read, write, edit, glob, stat) over a
  FileSystem seam, with the sandbox that confines them to a workspace root.
  Depends on tina_core only; mounting onto a loop is the host's job.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.6.0
dependencies:
  tina_core:
    path: ../tina_core
  path: ^1.9.0
  logging: ^1.2.0
dev_dependencies:
  test: ^1.25.0
