name: tina_cli
description: >-
  The headless shell: read a line, run one turn through tina_host, print
  what happened. The terminal front end's first slice — no TUI, no
  persistence; the core takes an injected provider factory and an injected
  writer so tests drive it with no terminal.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.6.0
dependencies:
  tina_core:
    path: ../tina_core
  tina_engine_2:
    path: ../tina_engine_2
  tina_host:
    path: ../tina_host
  tina_llm:
    path: ../tina_llm
  tina_tools:
    path: ../tina_tools
dev_dependencies:
  test: ^1.25.0
