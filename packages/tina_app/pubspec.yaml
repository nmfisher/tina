name: tina_app
description: >
  Frontend-independent tina application layer: session operations, turn
  execution, project services and workflow orchestration. Depends on the
  engine and neutral utilities only — no terminal packages, no root config.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  attractor:
    path: ../attractor
  path: ^1.9.0
  tina_engine:
    path: ../tina_engine

dev_dependencies:
  analyzer: ^13.0.0
  test: ^1.25.0
