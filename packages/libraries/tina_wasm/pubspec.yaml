name: tina_wasm
description: >-
  Wasm implementations of the tina_core I/O ports: HTTP over the tina:http
  host import, files over WASI preopens, environment over WASI. The wasm
  composition root injects these where a native build injects tina_io. It
  is deliberately not an engine package.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.13.0
dependencies:
  classification:
    path: ../../../packages/classification
  tina:
    path: ../../../apps/tina_cli
  tina_approvals:
    path: ../../../packages/plugins/tina_approvals
  tina_chat:
    path: ../../../packages/plugins/tina_chat
  tina_core:
    path: ../../tina_core
  tina_llm:
    path: ../../tina_llm
  tina_mode:
    path: ../../../packages/plugins/tina_mode
  tina_persistence:
    path: ../../../packages/plugins/tina_persistence
  tina_providers:
    path: ../../../packages/plugins/tina_providers
  tina_session_controls:
    path: ../../../packages/plugins/tina_session_controls
  tina_settings:
    path: ../../../packages/libraries/tina_settings
  tina_system_instruction:
    path: ../../../packages/plugins/tina_system_instruction
  tina_tools:
    path: ../../../packages/plugins/tina_tools
  toml: ^0.16.0
  wasm_components:
    git:
      url: https://github.com/nmfisher/wasm.dart.git
      path: pkg/wasm_components
      ref: c3c8f3230605033df01d637f2bfd635dad106125
  hooks: ">=1.0.0 <3.0.0"
dev_dependencies:
  test: ^1.25.0
  tina_io:
    path: ../tina_io
  wasm_tools:
    git:
      url: https://github.com/nmfisher/wasm.dart.git
      path: pkg/wasm_tools
      # The stage6 tip's wasm_tools needs a 3.14 dev SDK; this upstream
      # commit is the newest one that resolves on stable and still exposes
      # the WasmComponentAsset link-hook API. Local engine builds override
      # both wasm.dart pins via an uncommitted pubspec_overrides.yaml.
      ref: ec9f801ebe258fc4c8dc0dceec35af8b9447627f
dependency_overrides:
  # One resolution hosts both toolchains: the console stack's build hook
  # (dart_notcurses) asks for hooks ^1.0.0 while the wasm toolchain needs
  # hooks ^2.x. 2.2.0 satisfies both (code_assets stays on 1.x). This
  # override is scoped to tina_wasm's own resolution and never leaks into
  # other packages' lockfiles.
  hooks: ^2.0.2

# Compile SQLite from the vendored amalgamation (see
# packages/tina_sqlite/native/sqlite3.c) instead of downloading a prebuilt
# library at test time — keeps `dart test` offline and CI deterministic.
hooks:
  user_defines:
    sqlite3:
      source: source
      path: ../../../packages/tina_sqlite/native/sqlite3.c
