name: tina_wasm
description: >-
  Wasm implementations of the tina_core I/O ports: HTTP over the tina:http
  host import, files over WASI preopens, environment over WASI. The wasm
  composition root injects these where a native build injects tina_io. It
  is deliberately not an engine package.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.13.0
dependencies:
  classification:
    path: ../../../packages/classification
  tina:
    path: ../../../apps/tina_cli
  tina_approvals:
    path: ../../../packages/plugins/tina_approvals
  tina_activity:
    path: ../../../packages/plugins/tina_activity
  tina_context:
    path: ../../../packages/plugins/tina_context
  tina_grok_guard:
    path: ../../../packages/plugins/tina_grok_guard
  tina_chat:
    path: ../../../packages/plugins/tina_chat
  tina_console:
    path: ../../tina_console
  tina_core:
    path: ../../tina_core
  tina_host:
    path: ../../tina_host
  tina_llm:
    path: ../../tina_llm
  tina_mode:
    path: ../../../packages/plugins/tina_mode
  tina_persistence:
    path: ../../../packages/plugins/tina_persistence
  tina_plugin_registry:
    path: ../tina_plugin_registry
  tina_providers:
    path: ../../../packages/plugins/tina_providers
  tina_session_controls:
    path: ../../../packages/plugins/tina_session_controls
  tina_tui:
    path: ../../tina_tui
  tina_settings:
    path: ../../../packages/libraries/tina_settings
  tina_system_instruction:
    path: ../../../packages/plugins/tina_system_instruction
  tina_tasks:
    path: ../../../packages/plugins/tina_tasks
  tina_tools:
    path: ../../../packages/plugins/tina_tools
  toml: ^0.16.0
  wasm_components:
    git:
      url: https://github.com/nmfisher/wasm.dart.git
      path: pkg/wasm_components
      # The component-cache branch head (rebased onto wasm.dart main
      # 72d40fb; PR #19): runtime ComponentCache for the runner. Pinned
      # by sha — the branch may move after the merge.
      ref: 06aa0099eb9fd644eaba0a92e9d8fa3bc7394a87
  hooks: ">=1.0.0 <3.0.0"
dev_dependencies:
  test: ^1.25.0
  tina_io:
    path: ../tina_io
  wasm_tools:
    git:
      url: https://github.com/nmfisher/wasm.dart.git
      path: pkg/wasm_tools
      # NOT the component-cache head: wasm_tools at 06aa009 (and wasm.dart
      # main generally) requires SDK ^3.14.0-251.0.dev and cannot resolve
      # on the stable SDK CI analyzes with. This commit is the newest one
      # that resolves on stable and still exposes the WasmComponentAsset
      # link-hook API — a dev-only compile driver, so it does not gate the
      # release runner (WASM_DART_REF in release.yml is the runner pin).
      # Local engine builds override both wasm.dart pins via an
      # uncommitted pubspec_overrides.yaml.
      ref: ec9f801ebe258fc4c8dc0dceec35af8b9447627f
dependency_overrides:
  # One resolution hosts both toolchains: the console stack's build hook
  # (dart_notcurses) asks for hooks ^1.0.0 while the wasm toolchain needs
  # hooks ^2.x. 2.2.0 satisfies both (code_assets stays on 1.x). This
  # override is scoped to tina_wasm's own resolution and never leaks into
  # other packages' lockfiles.
  hooks: ^2.0.2

# Compile SQLite from the vendored amalgamation (see
# packages/tina_sqlite/native/sqlite3.c) instead of downloading a prebuilt
# library at test time — keeps `dart test` offline and CI deterministic.
hooks:
  user_defines:
    sqlite3:
      source: source
      path: ../../../packages/tina_sqlite/native/sqlite3.c
