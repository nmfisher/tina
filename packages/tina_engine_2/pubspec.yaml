name: tina_engine_2
description: >-
  An agent loop and plugin interface built on tina_core's value types and
  streaming LlmProvider. A review artifact; still not wired into the tina
  app.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.6.0
dependencies:
  tina_core:
    path: ../tina_core
dev_dependencies:
  # Demo-only: the "a tina_tools tool mounted on the loop" group. The
  # dependency points this way — engine demoing tools — and only in dev;
  # tina_tools itself depends on these contracts for real, and the
  # architecture guard refuses the reciprocal manifest edge.
  tina_tools:
    path: ../tina_tools
  test: ^1.25.0
