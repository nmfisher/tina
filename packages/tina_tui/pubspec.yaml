name: tina_tui
description: >-
  tina's terminal app: the full-screen front end and the headless assembly
  it drives — engine, host, services and the session loop wired against an
  injected provider factory and a captured writer, so a daemon or a test
  runs the whole app with no renderer. Views, terminal, commands and the
  approval dialog are the front end's pieces.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.6.0
dependencies:
  tina_core:
    path: ../tina_core
  tina_console:
    path: ../tina_console
  # The Terminal and Commands contracts a TUI session contributes and
  # reads. All non-terminal, acyclic.
  tina_services:
    path: ../tina_services
  # The assembly: the app itself, moved here when tina_cli died. The
  # host-free renderer tests and the headless assembly tests both hold.
  tina_engine_2:
    path: ../tina_engine_2
  tina_host:
    path: ../tina_host
  tina_llm:
    path: ../tina_llm
  tina_tools:
    path: ../tina_tools
  # The @ completion source's bounded walk (basename/posix joins).
  path: ^1.9.0
dev_dependencies:
  test: ^1.25.0
