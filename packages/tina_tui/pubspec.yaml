name: tina_tui
description: >-
  tina's terminal views, built on tina_console's generic toolkit and
  tina_core's value types: chat transcript, live stream, tool chips, status
  strip, and the approval dialog. Renderer-first — the loop's wiring comes
  later.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.6.0
dependencies:
  tina_core:
    path: ../tina_core
  tina_console:
    path: ../tina_console
  # The Terminal and Commands contracts a TUI session contributes and
  # reads. Non-terminal, acyclic.
  tina_services:
    path: ../tina_services
  # The Approver side of the dialog: the sandbox's permission vocabulary
  # (FileOperation, Approval, SandboxViolation), not the tools. tina_tools
  # is terminal-blind, so the layering still runs toward the terminal.
  tina_tools:
    path: ../tina_tools
dev_dependencies:
  test: ^1.25.0
