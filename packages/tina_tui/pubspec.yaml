name: tina_tui
description: >-
  tina's terminal views, built on tina_console's generic toolkit and
  tina_core's value types: chat transcript, live stream, tool chips, status
  strip, and the approval dialog. Renderer-first — the loop's wiring comes
  later.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.6.0
dependencies:
  tina_core:
    path: ../tina_core
  tina_console:
    path: ../tina_console
  # The Terminal and Commands contracts a TUI session contributes and
  # reads, plus the session wiring: the same host the shell drives,
  # mounted with the same plugins. All non-terminal, acyclic.
  tina_services:
    path: ../tina_services
  tina_host:
    path: ../tina_host
  tina_tools:
    path: ../tina_tools
dev_dependencies:
  test: ^1.25.0
  # The parity tests: a TUI run and a shell run of the same input must
  # produce the same log. Dev-only — the TUI never imports the shell in
  # production code, and the shell keeps no TUI dependency at all.
  tina_cli:
    path: ../tina_cli
