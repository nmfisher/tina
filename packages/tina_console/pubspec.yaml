name: tina_console
description: Raw-mode console toolkit — renderer, async line editor with multi-row redraw, and pure layout math. Reusable across Dart CLI projects.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.0.0

dependencies:
  fuzzy_ranker:
    path: ../fuzzy_ranker
  dart_notcurses:
    path: ../dart_notcurses
  logging: ^1.2.0

dev_dependencies:
  args: ^2.5.0
  fake_async: ^1.3.3
  test: ^1.25.0
