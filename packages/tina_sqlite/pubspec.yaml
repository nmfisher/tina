name: tina_sqlite
description: >-
  The one SQLite seam for tina: a versioned open-or-create step, a generic
  append-only entry log, and a generic key-value table — each wrapped in
  the same poison-pill guard. Extracted from the pattern
  tina_app's classification store was the first to need.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  sqlite3: ^3.5.2

dev_dependencies:
  test: ^1.25.0
