name: tina_subagents
description: >-
  Sub-agents as a plugin: launch_subagent launches a child session in the
  background (non-blocking) — its own provider, its own log, the parent's
  working directory and mode — and subagent inspects/joins/cancels it.
  The limits (depth, concurrency, token budget) are enforced here, and
  every refusal names the limit it hit.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.6.0
dependencies:
  tina_settings:
    path: ../../libraries/tina_settings
  tina_core:
    path: ../../tina_core
  tina_engine_2:
    path: ../../tina_engine_2
  tina_host:
    path: ../../tina_host
  tina_tools:
    path: ../tina_tools
dev_dependencies:
  tina_persistence:
    path: ../tina_persistence
  test: ^1.25.0

# Compile SQLite from the vendored amalgamation (see
# packages/tina_sqlite/native/sqlite3.c) instead of downloading a prebuilt
# library at test time — keeps `dart test` offline and CI deterministic.
hooks:
  user_defines:
    sqlite3:
      source: source
      path: ../../tina_sqlite/native/sqlite3.c
