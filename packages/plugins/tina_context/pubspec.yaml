name: tina_context
description: Opt-in agent-managed working context with an editable file mirror.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.6.0
dependencies:
  tina_settings:
    path: ../../libraries/tina_settings
  tina_engine_2:
    path: ../../tina_engine_2
dev_dependencies:
  test: ^1.25.0
  tina_persistence:
    path: ../tina_persistence

# Compile SQLite from the vendored amalgamation (see
# packages/tina_sqlite/native/sqlite3.c) instead of downloading a prebuilt
# library at test time — keeps `dart test` offline and CI deterministic.
hooks:
  user_defines:
    sqlite3:
      source: source
      path: ../../tina_sqlite/native/sqlite3.c
