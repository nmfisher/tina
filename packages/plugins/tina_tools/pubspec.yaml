name: tina_tools
description: The basic file tools (ls, read, write, edit, glob, stat) over a
  FileSystem seam, with the sandbox that confines them to a workspace root.
  Includes the tools plugin and mode command for tina_engine_2.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.6.0
dependencies:
  tina_mode:
    path: ../tina_mode
  tina_approvals:
    path: ../tina_approvals
  tina_host:
    path: ../../tina_host
  tina_core:
    path: ../../tina_core
  tina_engine_2:
    path: ../../tina_engine_2
  path: ^1.9.0
  logging: ^1.2.0
dev_dependencies:
  test: ^1.25.0
  tina_system_instruction:
    path: ../tina_system_instruction
  tina_llm:
    path: ../../tina_llm
