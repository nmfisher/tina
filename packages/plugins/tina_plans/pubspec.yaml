name: tina_plans
description: The plans plugin for tina.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.6.0
dependencies:
  tina_engine_2:
    path: ../../tina_engine_2
  tina_tools:
    path: ../tina_tools
dev_dependencies:
  tina_persistence:
    path: ../tina_persistence
  test: ^1.25.0
  tina_host:
    path: ../../tina_host

# Compile SQLite from the vendored amalgamation (see
# packages/tina_sqlite/native/sqlite3.c) instead of downloading a prebuilt
# library at test time — keeps `dart test` offline and CI deterministic.
hooks:
  user_defines:
    sqlite3:
      source: source
      path: ../../tina_sqlite/native/sqlite3.c
