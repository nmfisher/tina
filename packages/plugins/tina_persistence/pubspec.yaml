name: tina_persistence
description: Session persistence plugin with an injectable SQLite store opener.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.6.0
dependencies:
  path: ^1.9.0
  tina_mode:
    path: ../tina_mode
  tina_approvals:
    path: ../tina_approvals
  tina_settings:
    path: ../../libraries/tina_settings
  crypto: ^3.0.6
  tina_core:
    path: ../../tina_core
  tina_engine_2:
    path: ../../tina_engine_2
  tina_sqlite:
    path: ../../tina_sqlite
  sqlite3: ^3.5.2
dev_dependencies:
  test: ^1.25.0
  tina_host:
    path: ../../tina_host

# Compile SQLite from the vendored amalgamation (see
# packages/tina_sqlite/native/sqlite3.c) instead of downloading a prebuilt
# library at test time — keeps `dart test` offline and CI deterministic.
hooks:
  user_defines:
    sqlite3:
      source: source
      path: ../../tina_sqlite/native/sqlite3.c
